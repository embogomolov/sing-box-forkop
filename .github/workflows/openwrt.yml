name: OpenWrt packages

# Run by hand (Actions, OpenWrt packages, Run workflow): it builds the packages of the chosen
# targets and variants. Run from a vX.Y.Z-rN tag with release checked, it builds every target
# and variant and drafts that tag's release, published by hand once the assets are checked.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets, separated by spaces, or all; ./build.sh --list names them"
        type: string
        default: all
      variant:
        description: Variant
        type: choice
        options:
          - all
          - base
          - full
          - tiny
        default: all
      tags:
        description: "Custom tags instead of the variant, as ./build.sh --tags takes them"
        type: string
        default: ""
      release:
        description: "Draft the release of the vX.Y.Z-rN tag chosen in Use workflow from"
        type: boolean
        default: false
      install_command:
        description: "Only for a release Forkop's Components tab must not install itself: the command that installs it"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan the builds
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if [ "$INPUT_RELEASE" = true ]; then
            if [ "$REF_TYPE" != tag ] || ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
              echo "::error::A release is built from its vX.Y.Z-rN tag: choose the tag in Use workflow from"
              exit 1
            fi
            if [ "$INPUT_TARGETS" != all ] || [ "$INPUT_VARIANT" != all ] || [ -n "$INPUT_TAGS" ]; then
              echo "::error::A release carries every target and variant: leave targets, variant and tags as they are"
              exit 1
            fi
          fi
          read -r -a requested <<< "$INPUT_TARGETS"
          targets=$(./build.sh --print-targets "${requested[@]}")
          variants=$(./build.sh --print-variants)
          [ "$INPUT_VARIANT" = all ] || variants="$INPUT_VARIANT"
          [ -z "$INPUT_TAGS" ] || variants="custom"
          matrix=$(jq -cn --arg targets "$targets" --arg variants "$variants" --arg tags "$INPUT_TAGS" '
            { include: [ ($targets | split(" ") | map(select(. != "")))[] as $target
              | ($variants | split(" ") | map(select(. != "")))[] as $variant
              | { target: $target, variant: $variant, tags: (if $variant == "custom" then $tags else "" end) } ] }')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    needs: plan
    name: ${{ matrix.target }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      VARIANT: ${{ matrix.variant }}
      TAGS: ${{ matrix.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: release/forkop/GO_VERSION

      - name: Install apk-tools
        run: |
          set -euo pipefail
          docker run --rm -v /usr/local/bin:/mnt alpine:3.22 sh -c \
            "apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk"
          apk --version

      - name: Resolve the tags
        id: tags
        run: |
          set -euo pipefail
          if [ -n "$TAGS" ]; then
            args=(--tags "$TAGS")
          else
            args=(--variant "$VARIANT")
          fi
          tags=$(./build.sh --print-tags "${args[@]}" "$TARGET")
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          case ",$tags," in
            *,with_naive,*) echo "naive=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "naive=0" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fetch cronet-go
        if: steps.tags.outputs.naive == '1'
        run: ./build.sh --fetch-cronet

      - name: Cache the Chromium toolchain
        if: steps.tags.outputs.naive == '1'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sing-box-forkop/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/.cache/sing-box-forkop/cronet-go/naiveproxy/src/gn/out/
            ~/.cache/sing-box-forkop/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/.cache/sing-box-forkop/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-musl-${{ matrix.target }}-${{ hashFiles('.github/CRONET_GO_VERSION') }}

      - name: Build
        env:
          RESOLVED_TAGS: ${{ steps.tags.outputs.tags }}
        run: ./build.sh --tags "$RESOLVED_TAGS" "$TARGET"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-${{ matrix.target }}-${{ matrix.variant }}
          path: |
            dist/*.ipk
            dist/*.apk
          if-no-files-found: error

  release:
    if: inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Draft the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INSTALL_COMMAND: ${{ inputs.install_command }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release/forkop/manifest.sh dist "$TAG" "$GH_REPO"
          cd dist
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is published already: its assets stay as they are"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes
          fi
          gh release upload "$TAG" -- *.ipk *.apk release.json SHA256SUMS --clobber
