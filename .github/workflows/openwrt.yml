name: OpenWrt packages

# A release tag builds and publishes every variant for every target; a push or a pull request
# tests the core and builds every variant for arm64; a manual run builds what its inputs ask for.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-r[0-9]+"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets, separated by spaces, or all; ./build.sh --list names them"
        type: string
        default: all
      variant:
        description: Variant
        type: choice
        options:
          - all
          - base
          - full
          - tiny
        default: all
      tags:
        description: "Custom tags instead of the variant, as ./build.sh --tags takes them"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: release/forkop/GO_VERSION

      - name: Check the tree
        run: release/forkop/check-tree.sh

      - name: Test
        run: |
          set -euo pipefail
          tags=$(./build.sh --print-tags --variant full --tags -with_naive)
          go list ./... | grep -v '^github.com/sagernet/sing-box/common/netns$' |
            xargs go test -tags "$tags" -ldflags=-checklinkname=0
          # Ubuntu's namespace restrictions require privileges for this test.
          go test -c -tags "$tags" -ldflags=-checklinkname=0 -o "$RUNNER_TEMP/netns.test" ./common/netns
          sudo "$RUNNER_TEMP/netns.test" -test.v

      - name: Build with the required tags alone
        run: |
          set -euo pipefail
          tags=$(./build.sh --print-required-tags)
          go build -tags "$tags" -ldflags=-checklinkname=0 ./...
          go test -tags "$tags" -ldflags=-checklinkname=0 ./include

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan the builds
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          targets="arm64"
          variants=$(./build.sh --print-variants)
          if [ "$REF_TYPE" = tag ]; then
            targets=$(./build.sh --print-targets)
          elif [ "$EVENT" = workflow_dispatch ]; then
            read -r -a requested <<< "$INPUT_TARGETS"
            targets=$(./build.sh --print-targets "${requested[@]}")
            [ "$INPUT_VARIANT" = all ] || variants="$INPUT_VARIANT"
            [ -z "$INPUT_TAGS" ] || variants="custom"
          fi
          matrix=$(jq -cn --arg targets "$targets" --arg variants "$variants" --arg tags "${INPUT_TAGS:-}" '
            { include: [ ($targets | split(" ") | map(select(. != "")))[] as $target
              | ($variants | split(" ") | map(select(. != "")))[] as $variant
              | { target: $target, variant: $variant, tags: (if $variant == "custom" then $tags else "" end) } ] }')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    needs:
      - test
      - plan
    name: ${{ matrix.target }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      VARIANT: ${{ matrix.variant }}
      TAGS: ${{ matrix.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: release/forkop/GO_VERSION

      - name: Install apk-tools
        run: |
          set -euo pipefail
          docker run --rm -v /usr/local/bin:/mnt alpine:3.22 sh -c \
            "apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk"
          apk --version

      - name: Resolve the tags
        id: tags
        run: |
          set -euo pipefail
          if [ -n "$TAGS" ]; then
            args=(--tags "$TAGS")
          else
            args=(--variant "$VARIANT")
          fi
          tags=$(./build.sh --print-tags "${args[@]}" "$TARGET")
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          case ",$tags," in
            *,with_naive,*) echo "naive=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "naive=0" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fetch cronet-go
        if: steps.tags.outputs.naive == '1'
        run: ./build.sh --fetch-cronet

      - name: Cache the Chromium toolchain
        if: steps.tags.outputs.naive == '1'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sing-box-forkop/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/.cache/sing-box-forkop/cronet-go/naiveproxy/src/gn/out/
            ~/.cache/sing-box-forkop/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/.cache/sing-box-forkop/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-musl-${{ matrix.target }}-${{ hashFiles('.github/CRONET_GO_VERSION') }}

      - name: Build
        env:
          RESOLVED_TAGS: ${{ steps.tags.outputs.tags }}
        run: ./build.sh --tags "$RESOLVED_TAGS" "$TARGET"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-${{ matrix.target }}-${{ matrix.variant }}
          path: |
            dist/*.ipk
            dist/*.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.ipk *.apk > SHA256SUMS
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" -- *.ipk *.apk SHA256SUMS --clobber
